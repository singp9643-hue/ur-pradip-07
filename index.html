<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pradip | Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
overflow-x:hidden;
}


/* Background Video */

#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
}


/* VFX Overlay */

.vfx{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle,transparent 20%,#000 85%),
linear-gradient(120deg,rgba(255,0,60,.35),rgba(0,0,0,.8));

z-index:-2;
animation:vfxMove 8s infinite alternate;
}


@keyframes vfxMove{

from{
transform:scale(1);
}

to{
transform:scale(1.15);
}

}



/* Header */

header{

display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
background:rgba(0,0,0,.4);
backdrop-filter:blur(10px);

}


.logo{

font-size:28px;
font-weight:bold;
color:#ff003c;

}


nav a{

color:white;
text-decoration:none;
margin:15px;

}


/* Hero */

.hero{

min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
gap:60px;
padding:40px 8%;

}



.photo img{

width:330px;
height:330px;
object-fit:cover;
border-radius:50%;
border:5px solid #ff003c;
box-shadow:
0 0 20px #ff003c,
0 0 60px #ff003c;

}



.card{

background:rgba(255,255,255,.08);
padding:35px;
border-radius:25px;
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);

}



.text h1{

font-size:55px;

}


.text h1 span{

color:#ff003c;

}


.text h2{

margin-top:15px;
font-size:35px;

}


.text p{

margin-top:20px;
color:#ddd;
line-height:1.7;
max-width:500px;

.contact{
margin-top:30px;
}


.contact-btn{

display:inline-flex;
align-items:center;
gap:10px;
padding:13px 30px;
margin:10px;
border-radius:30px;
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
transition:.3s;

}


.whatsapp{

background:#25D366;
box-shadow:0 0 20px #25D366;

}


.instagram{

background:linear-gradient(45deg,#feda75,#d62976,#962fbf,#4f5bd5);
box-shadow:0 0 20px #d62976;

}


.contact-btn i{

font-size:22px;

}


.contact-btn:hover{

transform:scale(1.1);

}



footer{

text-align:center;
padding:30px;
color:#aaa;

}



@media(max-width:800px){

.hero{

flex-direction:column;
text-align:center;

}


.photo img{

width:260px;
height:260px;

}


.text h1{

font-size:40px;

}


nav{

display:none;

}

}


</style>

</head>


<body>


<!-- Background Video -->

<video autoplay muted loop id="bg-video">

<source src="background.mp4" type="video/mp4">

</video>


<div class="vfx"></div>



<header>

<div class="logo">
ur.pradip_07
</div>


<nav>

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>

</nav>


</header>




<section class="hero">


<div class="photo">

<img src="myphoto.jpg">

</div>



<div class="card">

<div class="text">


<h1>
Hi, I'm <span>Pradip</span>
</h1>


<h2>
Developer & Creator
</h2>


<p>
From Ranibandh, West Bengal.
I love technology, photography, gaming and web development.
My dream is to create something unique and inspire people.
</p>



<div class="contact">


<h2>
Contact Me
</h2>



<a class="contact-btn whatsapp"
href="https://wa.me/6362301512"
target="_blank">

<i class="fa-brands fa-whatsapp"></i>
WhatsApp

</a>



<a class="contact-btn instagram"
href="https://instagram.com/ur.pradip_07"
target="_blank">

<i class="fa-brands fa-instagram"></i>
Instagram

</a>



</div>


</div>

</div>


</section>




<footer>

© 2026 Pradip Official | ur.pradip_07

</footer>



</body>

</html>
}
